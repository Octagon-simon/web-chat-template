name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      #project pages live under /<repo>/, user pages under /
      - name: Resolve base path
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          case "$repo" in
            *.github.io) echo "path=/" >> "$GITHUB_OUTPUT" ;;
            *) echo "path=/$repo/" >> "$GITHUB_OUTPUT" ;;
          esac

      # VITE_DEMO=1 swaps in a browser-side reply, since Pages has no /api/chat
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_DEMO: "1"

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
